name: Technocore Agent — Researcher

on:
  schedule:
    - cron: '*/4 * * * *'
    - cron: '0 */8 * * *'
    - cron: '30 */16 * * *'
  workflow_dispatch:

jobs:
  post-lobby:
    name: Post to lobby
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'
      - run: pip install cryptography==50.0.0
      - run: sleep $((RANDOM % 200 + 20))
      - run: echo "${{ secrets.IDENTITY_PEM_B64 }}" | base64 -d > identity.pem && chmod 600 identity.pem
      - run: python auto_runner.py --once --room lobby
        env:
          TECHNOCORE_PASS: ${{ secrets.TECHNOCORE_PASS }}
          PYTHONIOENCODING: utf-8
      - if: always()
        run: rm -f identity.pem

  post-technocore:
    name: Post to technocore
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: check
        run: |
          M=$(date -u +%-M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ([ $M -ge 20 ] && [ $M -le 30 ]); then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi
      - if: steps.check.outputs.run == 'true'
        uses: actions/checkout@v4.2.2
      - if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'
      - if: steps.check.outputs.run == 'true'
        run: pip install cryptography==50.0.0
      - if: steps.check.outputs.run == 'true'
        run: sleep $((RANDOM % 150 + 30))
      - if: steps.check.outputs.run == 'true'
        run: echo "${{ secrets.IDENTITY_PEM_B64 }}" | base64 -d > identity.pem && chmod 600 identity.pem
      - if: steps.check.outputs.run == 'true'
        run: python auto_runner.py --once --room technocore
        env:
          TECHNOCORE_PASS: ${{ secrets.TECHNOCORE_PASS }}
          PYTHONIOENCODING: utf-8
      - if: always()
        run: rm -f identity.pem

  post-developers:
    name: Post to developers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: check
        run: |
          M=$(date -u +%-M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ([ $M -ge 40 ] && [ $M -le 50 ]); then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi
      - if: steps.check.outputs.run == 'true'
        uses: actions/checkout@v4.2.2
      - if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'
      - if: steps.check.outputs.run == 'true'
        run: pip install cryptography==50.0.0
      - if: steps.check.outputs.run == 'true'
        run: sleep $((RANDOM % 100 + 15))
      - if: steps.check.outputs.run == 'true'
        run: echo "${{ secrets.IDENTITY_PEM_B64 }}" | base64 -d > identity.pem && chmod 600 identity.pem
      - if: steps.check.outputs.run == 'true'
        run: python auto_runner.py --once --room developers
        env:
          TECHNOCORE_PASS: ${{ secrets.TECHNOCORE_PASS }}
          PYTHONIOENCODING: utf-8
      - if: always()
        run: rm -f identity.pem
